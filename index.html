<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor y Editor de Rangos - Cash 6-Max</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      
      /* Colores Acciones */
      --color-or: #38bdf8;        /* Azul claro */
      --color-call3bet: #1d4ed8;  /* Azul oscuro */
      --color-bet4: #f59e0b;      /* Naranja */
      --color-bet4bluff: #ef4444; /* Rojo */
      --color-bet3: #ef4444;      /* Rojo */
      --color-cc: #2563eb;        /* Azul Cold Call */
      --color-fold: #334155;      /* Gris Fold */
      --border-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    header { text-align: center; margin-bottom: 8px; width: 100%; max-width: 500px; }
    h1 { font-size: 1.1rem; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }

    .edit-toggle-btn {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .edit-toggle-btn.active {
      background: #22c55e;
      color: #fff;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
    }

    .sub-group { display: flex; gap: 4px; }

    .btn {
      flex: 1;
      padding: 6px 2px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn.active {
      border-color: var(--accent);
      background: #0284c7;
      color: #fff;
    }

    /* Panel de herramientas de edición */
    .editor-toolbar {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #f59e0b;
      margin-bottom: 8px;
    }

    .paint-btn {
      flex: 1;
      min-width: 70px;
      padding: 6px 2px;
      border: 2px solid transparent;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .paint-btn.selected { border-color: #fff; box-shadow: 0 0 5px #fff; }

    .matrix-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      grid-template-rows: repeat(13, 1fr);
      gap: 2px;
      background-color: var(--border-color);
      padding: 2px;
      border-radius: 6px;
      touch-action: none;
    }

    .cell {
      background-color: var(--color-fold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      border-radius: 2px;
      color: #fff;
    }

    .cell.or { background-color: var(--color-or); }
    .cell.call3bet { background-color: var(--color-call3bet); }
    .cell.bet4 { background-color: var(--color-bet4); }
    .cell.bet4bluff { background-color: var(--color-bet4bluff); }
    .cell.bet3 { background-color: var(--color-bet3); }
    .cell.cc { background-color: var(--color-cc); }

    .json-actions {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .json-btn {
      flex: 1;
      padding: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span>Visor de Rangos</span>
      <button class="edit-toggle-btn" id="edit-mode-btn" onclick="toggleEditMode()">✏️ Editar</button>
    </h1>
  </header>

  <!-- Pestañas Principales -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="setMode('OR')">Aperturas (OR)</button>
    <button class="tab-btn" onclick="setMode('3BET')">3Bet / Cold Call</button>
  </div>

  <!-- Posiciones OR -->
  <div class="controls" id="controls-or">
    <div class="sub-group">
      <button class="btn active" onclick="setOrPos('UTG')">UTG</button>
      <button class="btn" onclick="setOrPos('MP')">MP</button>
      <button class="btn" onclick="setOrPos('CO')">CO</button>
      <button class="btn" onclick="setOrPos('BU')">BU</button>
    </div>
  </div>

  <!-- Posiciones 3BET / CC -->
  <div class="controls" id="controls-3bet" style="display: none;">
    <div class="sub-group">
      <button class="btn active" onclick="set3BetPos('vsUTGMP')">vs UTG/MP</button>
      <button class="btn" onclick="set3BetPos('vsCOBU')">vs CO/BU</button>
      <button class="btn" onclick="set3BetPos('BBvsUTGMP')">BB vs UTG/MP</button>
      <button class="btn" onclick="set3BetPos('BBvsCOBUSB')">BB vs CO/BU/SB</button>
    </div>
  </div>

  <!-- Barra de Herramientas de Edición -->
  <div class="editor-toolbar" id="toolbar">
    <!-- Se llena dinámicamente según el modo -->
  </div>

  <!-- Matriz de Rangos -->
  <div class="matrix-container" id="matrix"></div>

  <!-- Herramientas de Backup -->
  <div class="json-actions">
    <button class="json-btn" onclick="exportData()">💾 Guardar Backup (Copiar JSON)</button>
    <button class="json-btn" onclick="importData()">📂 Cargar Backup</button>
    <button class="json-btn" style="color: #ef4444;" onclick="resetCurrentRange()">🗑️ Reset Posición</button>
  </div>

  <script>
    const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    
    let mode = 'OR';
    let orPos = 'UTG';
    let bet3Pos = 'vsUTGMP';
    let isEditMode = false;
    let selectedColorClass = 'or';
    let isMouseDown = false;

    // Estructura Vacía/Base de Datos
    let db = {
      OR: {
        UTG: {}, MP: {}, CO: {}, BU: {}
      },
      3BET: {
        vsUTGMP: {}, vsCOBU: {}, BBvsUTGMP: {}, BBvsCOBUSB: {}
      }
    };

    // Cargar de LocalStorage si existe
    function loadSavedData() {
      const saved = localStorage.getItem('poker_ranges_db');
      if (saved) {
        try { db = JSON.parse(saved); } catch(e) {}
      }
    }

    function saveData() {
      localStorage.setItem('poker_ranges_db', JSON.stringify(db));
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('edit-mode-btn');
      const toolbar = document.getElementById('toolbar');

      if (isEditMode) {
        btn.classList.add('active');
        btn.innerText = '✔️ Finalizar';
        toolbar.style.display = 'flex';
        setupToolbar();
      } else {
        btn.classList.remove('active');
        btn.innerText = '✏️ Editar';
        toolbar.style.display = 'none';
      }
    }

    function setupToolbar() {
      const toolbar = document.getElementById('toolbar');
      toolbar.innerHTML = '';

      let options = [];
      if (mode === 'OR') {
        options = [
          { label: 'OR', class: 'or', bg: 'var(--color-or)' },
          { label: 'Call 3B', class: 'call3bet', bg: 'var(--color-call3bet)' },
          { label: '4Bet Val', class: 'bet4', bg: 'var(--color-bet4)' },
          { label: '4Bet Blf', class: 'bet4bluff', bg: 'var(--color-bet4bluff)' },
          { label: 'Fold', class: 'fold', bg: 'var(--color-fold)' }
        ];
      } else {
        options = [
          { label: '3Bet', class: 'bet3', bg: 'var(--color-bet3)' },
          { label: 'Cold Call', class: 'cc', bg: 'var(--color-cc)' },
          { label: 'Fold', class: 'fold', bg: 'var(--color-fold)' }
        ];
      }

      options.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'paint-btn' + (idx === 0 ? ' selected' : '');
        b.innerText = opt.label;
        b.style.backgroundColor = opt.bg;
        b.onclick = () => {
          document.querySelectorAll('.paint-btn').forEach(el => el.classList.remove('selected'));
          b.classList.add('selected');
          selectedColorClass = opt.class;
        };
        toolbar.appendChild(b);
      });
      selectedColorClass = options[0].class;
    }

    function getCurrentMap() {
      if (mode === 'OR') return db.OR[orPos];
      return db['3BET'][bet3Pos];
    }

    function generateMatrix() {
      const container = document.getElementById('matrix');
      container.innerHTML = '';
      const currentMap = getCurrentMap();

      for (let i = 0; i < 13; i++) {
        for (let j = 0; j < 13; j++) {
          let combo = i === j ? ranks[i] + ranks[j] : (i < j ? ranks[i] + ranks[j] + 's' : ranks[j] + ranks[i] + 'o');
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerText = combo;

          const action = currentMap[combo];
          if (action && action !== 'fold') {
            cell.classList.add(action);
          }

          // Eventos para pintar (Click / Arrastre táctil o ratón)
          cell.onmousedown = () => { if(isEditMode) { isMouseDown = true; applyPaint(combo, cell); } };
          cell.onmouseenter = () => { if(isEditMode && isMouseDown) { applyPaint(combo, cell); } };
          cell.ontouchstart = (e) => { if(isEditMode) { applyPaint(combo, cell); } };

          container.appendChild(cell);
        }
      }
    }

    document.body.onmouseup = () => { isMouseDown = false; };

    function applyPaint(combo, cell) {
      const currentMap = getCurrentMap();
      cell.className = 'cell';

      if (selectedColorClass === 'fold') {
        delete currentMap[combo];
      } else {
        cell.classList.add(selectedColorClass);
        currentMap[combo] = selectedColorClass;
      }
      saveData();
    }

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (mode === 'OR') {
        document.getElementById('controls-or').style.display = 'flex';
        document.getElementById('controls-3bet').style.display = 'none';
      } else {
        document.getElementById('controls-or').style.display = 'none';
        document.getElementById('controls-3bet').style.display = 'flex';
      }
      if(isEditMode) setupToolbar();
      generateMatrix();
    }

    function setOrPos(pos) {
      orPos = pos;
      updateActiveBtn('controls-or', pos);
      generateMatrix();
    }

    function set3BetPos(pos) {
      bet3Pos = pos;
      updateActiveBtn('controls-3bet', pos);
      generateMatrix();
    }

    function updateActiveBtn(containerId, val) {
      const btns = document.querySelectorAll(`#${containerId} .btn`);
      btns.forEach(b => {
        if (b.getAttribute('onclick').includes(val)) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function exportData() {
      const dataStr = JSON.stringify(db, null, 2);
      navigator.clipboard.writeText(dataStr).then(() => {
        alert("✅ Configuración copiada al portapapeles. Puedes pegarla en un bloc de notas como copia de seguridad.");
      });
    }

    function importData() {
      const input = prompt("Pega aquí el código JSON guardado anteriormente:");
      if (input) {
        try {
          db = JSON.parse(input);
          saveData();
          generateMatrix();
          alert("✅ Rangos cargados con éxito.");
        } catch (e) {
          alert("❌ El código no es válido.");
        }
      }
    }

    function resetCurrentRange() {
      if (confirm("¿Estás seguro de borrar todas las manos asignadas en esta posición?")) {
        if (mode === 'OR') db.OR[orPos] = {};
        else db['3BET'][bet3Pos] = {};
        saveData();
        generateMatrix();
      }
    }

    // Inicializar
    loadSavedData();
    generateMatrix();
  </script>
</body>
</html>
