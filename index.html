<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Rangos - Cash 6-Max</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      
      --color-or: #38bdf8;        /* Azul claro */
      --color-call3bet: #1d4ed8;  /* Azul oscuro */
      --color-bet4: #f59e0b;      /* Naranja */
      --color-bet4bluff: #ef4444; /* Rojo */
      --color-bet3: #ef4444;      /* Rojo */
      --color-cc: #2563eb;        /* Azul Cold Call */
      --color-fold: #334155;      /* Gris Fold */
      --border-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    header { text-align: center; margin-bottom: 8px; width: 100%; max-width: 500px; }
    h1 { font-size: 1.1rem; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }

    .edit-toggle-btn {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .edit-toggle-btn.active {
      background: #22c55e;
      color: #fff;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
    }

    .sub-group { display: flex; gap: 4px; }

    .btn {
      flex: 1;
      padding: 6px 2px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn.active {
      border-color: var(--accent);
      background: #0284c7;
      color: #fff;
    }

    .editor-toolbar {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #f59e0b;
      margin-bottom: 8px;
    }

    .paint-btn {
      flex: 1;
      min-width: 65px;
      padding: 6px 2px;
      border: 2px solid transparent;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .paint-btn.selected { border-color: #fff; box-shadow: 0 0 6px #fff; }

    .matrix-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      grid-template-rows: repeat(13, 1fr);
      gap: 2px;
      background-color: var(--border-color);
      padding: 2px;
      border-radius: 6px;
    }

    .cell {
      background-color: var(--color-fold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      border-radius: 2px;
      color: #fff;
      cursor: pointer;
    }

    .cell.or { background-color: var(--color-or); color: #000; }
    .cell.call3bet { background-color: var(--color-call3bet); }
    .cell.bet4 { background-color: var(--color-bet4); color: #000; }
    .cell.bet4bluff { background-color: var(--color-bet4bluff); }
    .cell.bet3 { background-color: var(--color-bet3); }
    .cell.cc { background-color: var(--color-cc); }

    .json-actions {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .json-btn {
      flex: 1;
      padding: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span>Visor de Rangos</span>
      <button class="edit-toggle-btn" id="edit-mode-btn" onclick="toggleEditMode()">✏️ Editar</button>
    </h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-or" onclick="setMode('OR')">Aperturas (OR)</button>
    <button class="tab-btn" id="tab-3bet" onclick="setMode('3BET')">3Bet / Cold Call</button>
  </div>

  <div class="controls" id="controls-or">
    <div class="sub-group">
      <button class="btn active" onclick="setOrPos('UTG')">UTG</button>
      <button class="btn" onclick="setOrPos('MP')">MP</button>
      <button class="btn" onclick="setOrPos('CO')">CO</button>
      <button class="btn" onclick="setOrPos('BU')">BU</button>
    </div>
  </div>

  <div class="controls" id="controls-3bet" style="display: none;">
    <div class="sub-group">
      <button class="btn active" onclick="set3BetPos('vsUTGMP')">vs UTG/MP</button>
      <button class="btn" onclick="set3BetPos('vsCOBU')">vs CO/BU</button>
      <button class="btn" onclick="set3BetPos('BBvsUTGMP')">BB vs UTG/MP</button>
      <button class="btn" onclick="set3BetPos('BBvsCOBUSB')">BB vs CO/BU/SB</button>
    </div>
  </div>

  <div class="editor-toolbar" id="toolbar"></div>

  <div class="matrix-container" id="matrix"></div>

  <div class="json-actions">
    <button class="json-btn" onclick="exportData()">💾 Guardar Backup</button>
    <button class="json-btn" onclick="importData()">📂 Cargar Backup</button>
    <button class="json-btn" style="color: #ef4444;" onclick="resetCurrentRange()">🗑️ Reset Posición</button>
  </div>

  <script>
    const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    
    let mode = 'OR';
    let orPos = 'UTG';
    let bet3Pos = 'vsUTGMP';
    let isEditMode = false;
    let selectedColorClass = 'or';

    // RANGOS INICIALES PRE-CARGADOS
    const initialData = {
      OR: {
        UTG: { "AA":"bet4","KK":"bet4","QQ":"bet4","JJ":"bet4","AKs":"bet4","AKo":"bet4","AQs":"call3bet","AJs":"call3bet","ATs":"call3bet","KQs":"call3bet","KJs":"call3bet","QJs":"call3bet","JTs":"call3bet","TT":"call3bet","99":"call3bet","88":"call3bet","77":"call3bet","66":"call3bet","55":"call3bet","44":"call3bet","33":"call3bet","22":"call3bet","A9s":"or","A8s":"or","A7s":"or","A6s":"or","A5s":"or","A4s":"or","A3s":"or","A2s":"or","KTs":"or","QTs":"or","T9s":"or","98s":"or","87s":"or","76s":"or","65s":"or","54s":"or","AQo":"or","AJo":"or","ATo":"or" },
        MP: { "AA":"bet4","KK":"bet4","QQ":"bet4","JJ":"bet4","AKs":"bet4","AKo":"bet4","AQs":"call3bet","AJs":"call3bet","ATs":"call3bet","KQs":"call3bet","KJs":"call3bet","QJs":"call3bet","JTs":"call3bet","TT":"call3bet","99":"call3bet","88":"call3bet","77":"call3bet","66":"call3bet","55":"call3bet","A9s":"or","A8s":"or","A7s":"or","A6s":"or","A5s":"or","A4s":"or","A3s":"or","A2s":"or","KTs":"or","QTs":"or","T9s":"or","98s":"or","87s":"or","76s":"or","65s":"or","54s":"or","AQo":"or","AJo":"or","ATo":"or","44":"or","33":"or","22":"or" },
        CO: { "AA":"bet4","KK":"bet4","QQ":"bet4","AKs":"bet4","AKo":"bet4","JJ":"call3bet","TT":"call3bet","99":"call3bet","88":"call3bet","77":"call3bet","66":"call3bet","55":"call3bet","44":"call3bet","33":"call3bet","22":"call3bet","AQs":"call3bet","AJs":"call3bet","ATs":"call3bet","A9s":"call3bet","KQs":"call3bet","KJs":"call3bet","KTs":"call3bet","QJs":"call3bet","QTs":"call3bet","JTs":"call3bet","T9s":"call3bet","98s":"call3bet","87s":"call3bet","76s":"call3bet","65s":"call3bet","54s":"call3bet","AQo":"call3bet","AJo":"call3bet","A8s":"or","A7s":"or","A6s":"or","A5s":"or","A4s":"or","A3s":"or","A2s":"or","ATo":"or","KQo":"or" },
        BU: { "AA":"bet4","KK":"bet4","QQ":"bet4","AKs":"bet4","AKo":"bet4","AJo":"bet4bluff","KJo":"bet4bluff","JJ":"call3bet","TT":"call3bet","99":"call3bet","88":"call3bet","77":"call3bet","66":"call3bet","55":"call3bet","44":"call3bet","33":"call3bet","22":"call3bet","AQs":"call3bet","AJs":"call3bet","ATs":"call3bet","A9s":"call3bet","KQs":"call3bet","KJs":"call3bet","KTs":"call3bet","QJs":"call3bet","QTs":"call3bet","JTs":"call3bet","T9s":"call3bet","98s":"call3bet","87s":"call3bet","76s":"call3bet","65s":"call3bet","54s":"call3bet","AQo":"call3bet","A8s":"or","A7s":"or","A6s":"or","A5s":"or","A4s":"or","A3s":"or","A2s":"or","ATo":"or","KQo":"or" }
      },
      "3BET": {
        vsUTGMP: { "AA":"bet3","KK":"bet3","QQ":"bet3","AKs":"bet3","AKo":"bet3","AQo":"bet3","JJ":"cc","TT":"cc","99":"cc","88":"cc","77":"cc","66":"cc","55":"cc","44":"cc","33":"cc","22":"cc","AQs":"cc","AJs":"cc","ATs":"cc","KQs":"cc","KJs":"cc","QJs":"cc","JTs":"cc" },
        vsCOBU: { "AA":"bet3","KK":"bet3","QQ":"bet3","JJ":"bet3","TT":"bet3","99":"bet3","AKs":"bet3","AQs":"bet3","AJs":"bet3","ATs":"bet3","AKo":"bet3","AQo":"bet3","KQo":"bet3","AJo":"bet3","88":"cc","77":"cc","66":"cc","55":"cc","44":"cc","33":"cc","22":"cc","KQs":"cc","KJs":"cc","KTs":"cc","QJs":"cc","QTs":"cc","JTs":"cc","T9s":"cc","98s":"cc","87s":"cc","76s":"cc","65s":"cc","54s":"cc" },
        BBvsUTGMP: { "AA":"bet3","KK":"bet3","QQ":"bet3","AKs":"bet3","AKo":"bet3","JJ":"cc","TT":"cc","99":"cc","88":"cc","77":"cc","66":"cc","55":"cc","44":"cc","33":"cc","22":"cc","AQs":"cc","AJs":"cc","ATs":"cc","A9s":"cc","A8s":"cc","A7s":"cc","A6s":"cc","A5s":"cc","A4s":"cc","A3s":"cc","A2s":"cc","KQs":"cc","KJs":"cc","KTs":"cc","QJs":"cc","QTs":"cc","JTs":"cc","T9s":"cc","98s":"cc","87s":"cc","76s":"cc","65s":"cc","54s":"cc","AQo":"cc","AJo":"cc","ATo":"cc","KQo":"cc" },
        BBvsCOBUSB: { "AA":"bet3","KK":"bet3","QQ":"bet3","JJ":"bet3","TT":"bet3","99":"bet3","AKs":"bet3","AQs":"bet3","AJs":"bet3","ATs":"bet3","AKo":"bet3","AQo":"bet3","AJo":"bet3","ATo":"bet3","KQo":"bet3","88":"cc","77":"cc","66":"cc","55":"cc","44":"cc","33":"cc","22":"cc","A9s":"cc","A8s":"cc","A7s":"cc","A6s":"cc","A5s":"cc","A4s":"cc","A3s":"cc","A2s":"cc","KQs":"cc","KJs":"cc","KTs":"cc","K9s":"cc","QJs":"cc","QTs":"cc","JTs":"cc","T9s":"cc","98s":"cc","87s":"cc","76s":"cc","65s":"cc","54s":"cc","43s":"cc","32s":"cc" }
      }
    };

    let db = JSON.parse(JSON.stringify(initialData));

    function loadSavedData() {
      const saved = localStorage.getItem('poker_ranges_v2');
      if (saved) {
        try { db = JSON.parse(saved); } catch(e) {}
      }
    }

    function saveData() {
      localStorage.setItem('poker_ranges_v2', JSON.stringify(db));
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('edit-mode-btn');
      const toolbar = document.getElementById('toolbar');

      if (isEditMode) {
        btn.classList.add('active');
        btn.innerText = '✔️ Finalizar';
        toolbar.style.display = 'flex';
        setupToolbar();
      } else {
        btn.classList.remove('active');
        btn.innerText = '✏️ Editar';
        toolbar.style.display = 'none';
      }
    }

    function setupToolbar() {
      const toolbar = document.getElementById('toolbar');
      toolbar.innerHTML = '';

      let options = [];
      if (mode === 'OR') {
        options = [
          { label: 'OR', class: 'or', bg: 'var(--color-or)' },
          { label: 'Call 3B', class: 'call3bet', bg: 'var(--color-call3bet)' },
          { label: '4Bet Val', class: 'bet4', bg: 'var(--color-bet4)' },
          { label: '4Bet Blf', class: 'bet4bluff', bg: 'var(--color-bet4bluff)' },
          { label: 'Fold', class: 'fold', bg: 'var(--color-fold)' }
        ];
      } else {
        options = [
          { label: '3Bet', class: 'bet3', bg: 'var(--color-bet3)' },
          { label: 'Cold Call', class: 'cc', bg: 'var(--color-cc)' },
          { label: 'Fold', class: 'fold', bg: 'var(--color-fold)' }
        ];
      }

      options.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'paint-btn' + (idx === 0 ? ' selected' : '');
        b.innerText = opt.label;
        b.style.backgroundColor = opt.bg;
        b.onclick = () => {
          document.querySelectorAll('.paint-btn').forEach(el => el.classList.remove('selected'));
          b.classList.add('selected');
          selectedColorClass = opt.class;
        };
        toolbar.appendChild(b);
      });
      selectedColorClass = options[0].class;
    }

    function getCurrentMap() {
      if (mode === 'OR') return db.OR[orPos];
      return db['3BET'][bet3Pos];
    }

    function generateMatrix() {
      const container = document.getElementById('matrix');
      container.innerHTML = '';
      const currentMap = getCurrentMap();

      for (let i = 0; i < 13; i++) {
        for (let j = 0; j < 13; j++) {
          let combo = i === j ? ranks[i] + ranks[j] : (i < j ? ranks[i] + ranks[j] + 's' : ranks[j] + ranks[i] + 'o');
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerText = combo;

          const action = currentMap[combo];
          if (action && action !== 'fold') {
            cell.classList.add(action);
          }

          cell.onclick = () => {
            if (isEditMode) {
              applyPaint(combo, cell);
            }
          };

          container.appendChild(cell);
        }
      }
    }

    function applyPaint(combo, cell) {
      const currentMap = getCurrentMap();
      cell.className = 'cell';

      if (selectedColorClass === 'fold') {
        delete currentMap[combo];
      } else {
        cell.classList.add(selectedColorClass);
        currentMap[combo] = selectedColorClass;
      }
      saveData();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('tab-or').classList.toggle('active', mode === 'OR');
      document.getElementById('tab-3bet').classList.toggle('active', mode === '3BET');

      document.getElementById('controls-or').style.display = (mode === 'OR') ? 'flex' : 'none';
      document.getElementById('controls-3bet').style.display = (mode === '3BET') ? 'flex' : 'none';

      if(isEditMode) setupToolbar();
      generateMatrix();
    }

    function setOrPos(pos) {
      orPos = pos;
      updateActiveBtn('controls-or', pos);
      generateMatrix();
    }

    function set3BetPos(pos) {
      bet3Pos = pos;
      updateActiveBtn('controls-3bet', pos);
      generateMatrix();
    }

    function updateActiveBtn(containerId, val) {
      const btns = document.querySelectorAll(`#${containerId} .btn`);
      btns.forEach(b => {
        if (b.getAttribute('onclick').includes(val)) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function exportData() {
      const dataStr = JSON.stringify(db, null, 2);
      navigator.clipboard.writeText(dataStr).then(() => {
        alert("✅ Configuración copiada al portapapeles.");
      });
    }

    function importData() {
      const input = prompt("Pega aquí el código JSON guardado:");
      if (input) {
        try {
          db = JSON.parse(input);
          saveData();
          generateMatrix();
          alert("✅ Cargado correctamente.");
        } catch (e) {
          alert("❌ Código no válido.");
        }
      }
    }

    function resetCurrentRange() {
      if (confirm("¿Limpiar esta posición?")) {
        if (mode === 'OR') db.OR[orPos] = {};
        else db['3BET'][bet3Pos] = {};
        saveData();
        generateMatrix();
      }
    }

    // Inicialización
    loadSavedData();
    generateMatrix();
  </script>
</body>
</html>
